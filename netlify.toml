[build]
command = "npm run build"
publish = "dist/client"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[context.production]
command = "npm run build"
publish = "dist/client"

# Cache control for assets
[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# Don't cache HTML
[[headers]]
for = "/*.html"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"
